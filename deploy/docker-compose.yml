name: vesper
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [vesper_internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5173
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_SSL: ${DB_SSL:-disable}
      BOOTSTRAP_DEFAULT_MENTOR: ${BOOTSTRAP_DEFAULT_MENTOR:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && if [ \"$${BOOTSTRAP_DEFAULT_MENTOR}\" = \"true\" ]; then npm run bootstrap:local-mentor; fi && node server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [vesper_internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-3005}:80"
      - "${HTTPS_PORT:-3443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [vesper_internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Fc -f "/backups/vesper-$$(date +%Y%m%d-%H%M%S).dump"
          find /backups -type f -name 'vesper-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vesper_internal]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  vesper_internal:
    driver: bridge
